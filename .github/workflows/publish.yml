name: Publish Package

# main -> prod hub (token minted from AUX4_PUBLISHER_* client credentials against
#         prod SSO; default registry)
# dev  -> dev hub  (token minted from AUX4_DEV_PUBLISHER_* client credentials
#         against dev SSO, since the dev hub validates against dev SSO; registry
#         pointed at the dev hub). Both paths call aux4/action@v1 command:publish;
#         only the token + registry differ (the SFA-039 dev/prod pattern, mirrors
#         packages/remote and packages/cloud-remote).
on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      AUX4_REGISTRY_URL: ${{ github.ref_name != 'main' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint
        uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  test-darwin:
    needs: [lint]
    runs-on: macos-14
    # aux4/computer (a dependency) only reaches the prod hub when it is promoted: install
    # dependencies from the dev hub everywhere but main.
    env:
      AUX4_REGISTRY_URL: ${{ github.ref_name != 'main' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test
        uses: aux4/action@v1
        with:
          command: test
          build_command: aux4 builder darwin

      # The aux4/computer provider contract suite (headless: dry runs + a temporary state dir).
      # The test step installed aux4, aux4/test, this package and aux4/computer.
      - name: Conformance
        shell: bash
        run: aux4 computer conformance --provider mac

      # The Swift binaries can only be built on macOS, but the publish step of
      # aux4/action runs in Docker, which macOS runners don't have. Hand the
      # tested binaries to the Linux publish job.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: package/dist
          if-no-files-found: error

  # Live UI test on the hosted macOS runner (live.yml). Publishing waits on it.
  test-live:
    needs: [lint]
    uses: ./.github/workflows/live.yml

  publish:
    needs: [test-darwin, test-live]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: package/dist

      - name: Restore executable bit
        run: chmod +x package/dist/darwin/*/aux4-computer-mac

      - name: Mint prod hub publish token
        id: mint
        if: github.ref_name == 'main'
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      # The dev hub is validated by dev SSO, so a prod token is rejected there.
      # Mint a short-lived dev publish token from the dev publisher client
      # credentials. Only runs on the dev branch.
      - name: Mint dev hub publish token
        id: devmint
        if: github.ref_name == 'dev'
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::dev publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://dev.sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token from dev SSO"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          # dev -> minted dev token; main -> minted prod token
          aux4_token: ${{ github.ref_name == 'dev' && steps.devmint.outputs.token || steps.mint.outputs.token }}
          # dev -> dev hub registry; main -> default (prod) hub
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
